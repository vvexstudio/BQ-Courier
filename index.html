<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BQ Courier — Williamsburg</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #ffffff;
        --dim: rgba(255, 255, 255, 0.75);
        --accent: #ffb02e;   /* route amber */
        --hot: #ff4fa3;      /* beacon magenta */
        --good: #39ff9a;     /* bike-lane green */
        --bad: #ff5d5d;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #63c5f2; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      /* Racing-game HUD: flat pixel text with a hard drop shadow, no panels. */
      .hud {
        position: fixed;
        font-family: 'Press Start 2P', ui-monospace, Menlo, monospace;
        color: var(--ink);
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
        pointer-events: none;
        user-select: none;
      }
      .cap { font-size: 8px; letter-spacing: 0.18em; color: var(--dim); margin-top: 6px; }

      /* ---- top-left: deliveries (the "checkpoint" block) ---- */
      #deliveries { top: 22px; left: 24px; }
      #deliveries .big { font-size: 26px; }
      #deliveries .sub { font-size: 8px; color: var(--good); margin-top: 8px; }

      /* ---- top-center: elapsed clock + order remaining ---- */
      #clock { top: 18px; left: 50%; transform: translateX(-50%); text-align: center; }
      #elapsed { font-size: 24px; }
      #remaining { font-size: 16px; margin-top: 10px; }
      #remaining.low { color: var(--bad); animation: blink 0.5s steps(2) infinite; }
      #orderline { font-size: 8px; color: var(--accent); margin-top: 10px; letter-spacing: 0.08em; }
      @keyframes blink { 50% { opacity: 0.25; } }

      /* ---- top-right: crashes + score ---- */
      #crashpanel { top: 22px; right: 24px; text-align: right; }
      #crashpanel .big { font-size: 26px; }
      #scoreline { font-size: 8px; color: var(--accent); margin-top: 8px; }

      /* ---- bottom-left: speedo + boost meter ---- */
      #speedo { bottom: 20px; left: 24px; }
      #speedo .big { font-size: 22px; }
      #fps { font-size: 7px; color: var(--dim); margin-top: 6px; }
      #boostwrap {
        width: 120px; height: 10px; margin-top: 8px;
        border: 2px solid rgba(255, 255, 255, 0.65);
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35);
      }
      #boostbar {
        height: 100%; width: 0%;
        background: var(--accent);
        transition: width 0.1s linear;
      }
      #boostbar.full { background: var(--good); }
      #boostbar.firing { background: var(--hot); }

      /* ---- event ticker: near-misses, combos, wipeouts ---- */
      #ticker {
        top: 46%; left: 50%; transform: translate(-50%, -50%) scale(0.85);
        font-size: 13px; letter-spacing: 0.06em;
        color: var(--accent);
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.65);
        opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease;
        text-align: center;
      }
      #ticker.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      #ticker.bad { color: var(--bad); }

      /* ---- bottom-center: status + help ---- */
      #status { bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 7px; color: var(--dim); text-align: center; }

      /* ---- bottom-right: round minimap ---- */
      #maphud { bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
      #minimap {
        display: block; width: 200px; height: 200px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.65);
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35);
      }
      #help { font-size: 6px; color: var(--dim); text-align: right; }

      /* ---- center toast ---- */
      #toast {
        top: 34%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
        font-size: 24px; letter-spacing: 0.04em;
        color: var(--good);
        text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.65);
        opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
        text-align: center;
      }
      #toast .sub { font-size: 10px; color: var(--ink); margin-top: 12px; }
      #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      #toast.bad { color: var(--bad); }

      .hidden { display: none !important; }

      /* Long status line must never collide with the map/help. */
      #status { max-width: 34vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #orderline { max-width: 60vw; margin-left: auto; margin-right: auto; }

      /* Narrow windows: shrink the top row so the three blocks never overlap. */
      @media (max-width: 760px) {
        #deliveries .big, #crashpanel .big { font-size: 16px; }
        #elapsed { font-size: 14px; }
        #remaining { font-size: 11px; }
        #orderline, #deliveries .sub, #scoreline { font-size: 6px; }
        .cap { font-size: 6px; }
        #speedo .big { font-size: 14px; }
        #minimap { width: 130px; height: 130px; }
        #status { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="deliveries" class="hud">
      <div class="big" id="delivered">0</div>
      <div class="cap">DELIVERED</div>
      <div class="sub" id="streak">×0 STREAK</div>
    </div>

    <div id="clock" class="hud">
      <div id="elapsed">00:00:00</div>
      <div id="remaining">--:--</div>
      <div class="cap">REMAINING</div>
      <div id="orderline" class="hidden">—</div>
    </div>

    <div id="crashpanel" class="hud">
      <div class="big" id="crashes">0</div>
      <div class="cap">CRASHES</div>
      <div id="scoreline">0 PTS</div>
    </div>

    <div id="speedo" class="hud">
      <div class="big"><span id="kmh">0</span></div>
      <div class="cap">KM/H</div>
      <div id="boostwrap"><div id="boostbar"></div></div>
      <div class="cap">BOOST</div>
      <div id="fps">— fps</div>
    </div>

    <div id="status" class="hud">loading…</div>

    <div id="maphud" class="hud">
      <canvas id="minimap" width="400" height="400"></canvas>
      <div id="help">W/S THROTTLE · A/D STEER · SPACE BRAKE · SHIFT HOP · E BOOST · B BELL · Q BAGEL · O FREE-CAM</div>
    </div>

    <div id="toast" class="hud"><div id="toast-main"></div><div class="sub" id="toast-sub"></div></div>
    <div id="ticker" class="hud"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
